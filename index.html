<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATR | سَطْر</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SATR">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy2:#143358;--gold:#C9A24B;--bg:#F7F5EF;--card:#fff;--ink:#12263F;--mut:#5D6B7E;--ok:#1E8E5A;--bad:#C0392B;--line:#E3DFD3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08172B;--card:#0F2646;--ink:#EEF1F6;--mut:#9AA9BE;--line:#1F3A60}}
:root[data-theme="dark"]{--bg:#08172B;--card:#0F2646;--ink:#EEF1F6;--mut:#9AA9BE;--line:#1F3A60}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.8}
a{color:inherit}
.wrap{max-width:1040px;margin:auto;padding:0 16px}
header{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
header .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:10px}
.logo{font-weight:700;font-size:22px;letter-spacing:1px;cursor:pointer}.logo b{color:var(--gold)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{padding:6px 12px;border-radius:99px;font-size:14px;text-decoration:none;white-space:nowrap;color:#D5DDEA;cursor:pointer}
nav a.on,nav a:hover{background:var(--gold);color:var(--navy)}
.btn{border:0;border-radius:12px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--gold);color:var(--navy);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.alt{background:transparent;border:1.5px solid var(--gold);color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:4px 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:48px 0 56px}
.hero .wrap{display:grid;gap:32px;grid-template-columns:1.1fr .9fr;align-items:center}
.hero h1{font-size:clamp(34px,6vw,56px);margin:0;line-height:1.3}.hero h1 span{display:block;color:var(--gold);font-size:.55em;font-weight:500}
.hero p{color:#C7D2E3;max-width:46ch}
.read{background:#FBF9F3;color:#1A2B45;border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px #0006;font-size:17px}
.read .ln{border-bottom:1.5px solid #D9D2BC;padding:2px 0;opacity:.35}
.read .ln.hot{opacity:1;background:linear-gradient(transparent 60%,#C9A24B55 60%);animation:sweep 6s infinite}
@keyframes sweep{0%,100%{opacity:.35}30%,60%{opacity:1}}
@media (prefers-reduced-motion:reduce){.read .ln.hot{animation:none;opacity:1}}
section{padding:36px 0}h2{margin:0 0 16px;font-size:26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px #0B1F3A12}
.plan{border-top:4px solid var(--gold)}.plan.feat{border-top-color:var(--navy);outline:2px solid var(--gold)}
.price{font-size:30px;font-weight:700}.price small{font-size:14px;color:var(--mut);font-weight:400}
.muted{color:var(--mut);font-size:14px}
.stat{font-size:24px;font-weight:700}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700}
.t-ok{background:#1E8E5A22;color:var(--ok)}.t-w{background:#C9A24B33;color:#8A6A1B}.t-bad{background:#C0392B22;color:var(--bad)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}summary{cursor:pointer;font-weight:700}
label{display:block;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.form{max-width:440px;margin:32px auto}
.warn{background:#C0392B14;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.note{background:#C9A24B22;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.task{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.task p{margin:4px 0;max-width:60ch}
.bdg{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin-inline-start:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;text-align:center;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #C0392Baa}70%{box-shadow:0 0 0 8px #C0392B00}100%{box-shadow:0 0 0 0 #C0392B00}}
@media (prefers-reduced-motion:reduce){.bdg{animation:none}}
.mrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin:4px 0}.mrow p{margin:0}
#fab{position:fixed;inset-inline-end:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);font-size:26px;line-height:1;box-shadow:0 6px 18px #0007;z-index:15;cursor:pointer;animation:pulse 1.6s infinite}
#fab[hidden]{display:none}#fab:active{transform:scale(.94)}
#fab span{position:absolute;top:-6px;inset-inline-start:-6px;min-width:24px;height:24px;line-height:24px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;padding:0 6px}
@media (prefers-reduced-motion:reduce){#fab{animation:none}}
.tb{text-align:center;line-height:1.5}.tb.on2{background:var(--gold);color:var(--navy)}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;padding:12px 16px;border-radius:12px;color:#fff;font-weight:700;transform:translateY(150%);transition:transform .3s;z-index:20}
#toast.show{transform:none}
footer{background:var(--navy);color:#9FB0C8;padding:24px 0;font-size:14px;margin-top:32px}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}header .wrap{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="logo" onclick="go('home')" tabindex="0">SATR <b>سَطْر</b></div>
<nav id="nav" aria-label="التنقل"></nav>
</div></header>
<div id="dbbar" hidden style="background:var(--bad);color:#fff;padding:8px 16px;text-align:center;font-size:14px"></div>
<main id="app"></main>
<footer><div class="wrap">SATR | سَطْر — Read, Complete, Earn. <span id="dbs" style="margin-inline-start:8px"></span></div></footer>
<button id="fab" hidden onclick="fabGo()" aria-label="رسائل جديدة"></button>
<div id="toast" role="status"></div>
<script>
const fmt=n=>Number(n).toLocaleString('ar-SY')+' ل.س';
const PLANS=[{id:1,name:'المستوى الأول',price:50000,dep:5000,tasks:1,reward:170,inv:500},{id:2,name:'المستوى الثاني',price:120000,dep:12000,tasks:2,reward:200,inv:1000},{id:3,name:'المستوى الثالث',price:360000,dep:36000,tasks:3,reward:400,inv:5000}];
const TASKS=[
 {id:1,t:'الحرف العربي عبر القرون',lv:1},{id:2,t:'فن الخط الكوفي',lv:2},{id:3,t:'رحلة الكتاب المطبوع',lv:3}
].map(x=>({...x,q:{q:'كم عدد الأسطر التي طُلب منك قراءتها؟',o:['ثلاثة','خمسة','سبعة'],a:1},body:['اقرأ هذه الأسطر الخمسة بتمعّن، ثم اضغط إتمام المهمة.','تتغير النصوص يومياً بحسب ما تضيفه الإدارة.','كل مهمة مموّلة من رعاة أو إعلانات داخل النص.','تُحتسب المهمة مرة واحدة فقط في اليوم نفسه.','المكافأة صغيرة وثابتة وتظهر قبل البدء.']}));
const S={user:null,admin:false,seq:10002,msgs:[],faq:[{q:'هل الأرباح مضمونة؟',a:'لا. المكافآت صغيرة وتعتمد على إيرادات الرعاة والإعلانات المتاحة.'},{q:'متى أستطيع السحب؟',a:'مرة أسبوعياً في يوم تحدده الإدارة، بعد بلوغ الحد الأدنى.'}],ann:[],alog:[],settings:{tg:'satr_support',sc:'DEMO-SHAMCASH-CODE',min:10000,day:'الخميس',ap:'SATR@2026'},
 users:[{id:'SA10001',name:'سارة',pw:'demo1234',phone:'0991111111',plan:2,status:'active',bal:1200,hold:0,done:[],code:'SATR10001',inv:[]},{id:'SA10002',name:'ياسر',pw:'demo1234',phone:'0992222222',plan:1,status:'pending',bal:0,hold:0,done:[],code:'SATR10002',inv:[]}],
 wd:[{id:'W1001',u:'SA10001',name:'سارة',phone:'0991111111',amt:10000,owner:'سارة أ.',code:'SC-48213',date:'2026-11-03',st:'review',note:''}],
 log:[{u:'SA10001',d:'2026-11-02',k:'إيداع (تجريبي)',a:1200}]};
const $=s=>document.querySelector(s);
function A(t){S.alog.push({d:new Date().toISOString().slice(0,16).replace('T',' '),t});if(S.alog.length>200)S.alog.shift()}
const faqHTML=()=>S.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function toast(m,ok=true){if(ok)save();const t=$('#toast');t.textContent=m;t.style.background=ok?'var(--ok)':'var(--bad)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
const me=()=>S.user&&S.users.find(u=>u.id===S.user);
const plan=u=>PLANS.find(p=>p.id===u.plan);
const today=()=>new Date().toISOString().slice(0,10);
function go(p){location.hash=p;}
const PUB=[['home','الرئيسية'],['login','دخول'],['register','حساب جديد']];
const USR=[['dash','الرئيسية'],['tasks','المهام'],['levels','المستويات'],['refs','الدعوات'],['wallet','المحفظة'],['deposit','شحن'],['withdraw','سحب'],['history','السجل'],['orders','طلباتي'],['trade','تداول تجريبي'],['support','الدعم'],['profile','حسابي']];
function drawNav(){const p=(location.hash||'#home').slice(1),u=me();
 const items=S.admin?[['admin','الإدارة']]:u?USR:PUB;
 const n2=u?S.wd.filter(w=>w.u===u.id&&w.st!=='review'&&!w.seen).length:0;
 const n=S.admin?S.msgs.filter(m=>m.from==='user'&&!m.aread).length:u?S.msgs.filter(m=>m.u===u.id&&m.from==='admin'&&!m.read).length:0;
 $('#nav').innerHTML=items.map(([k,l])=>`<a href="#${k}" class="${p===k?'on':''}">${l}${(k==='support'||k==='admin')&&n?`<span class="bdg" aria-label="رسائل جديدة">${n}</span>`:''}${k==='orders'&&n2?`<span class="bdg" aria-label="تحديث في طلباتك">${n2}</span>`:''}</a>`).join('')+(u||S.admin?'<a id="out">خروج</a>':'<a href="#admin-login">الإدارة</a>');
 const o=$('#out');if(o)o.onclick=()=>{S.user=null;S.admin=false;go('home')};
 const f=$('#fab');f.hidden=!(n>0&&!(u&&p==='support'));f.innerHTML='💬<span>'+n+'</span>';
 document.title=(n?'('+n+') ':'')+'SATR | سَطْر'}
function fabGo(){if(!S.admin)return go('support');
 S.msgs.forEach(m=>{if(m.from==='user')m.aread=true});save();drawNav();
 const sc=()=>{const e=$('#msgs');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})};
 if(location.hash!=='#admin'){go('admin');setTimeout(sc,250)}else sc()}
function render(){
 try{S.user?localStorage.setItem('satr_u',S.user):localStorage.removeItem('satr_u')}catch(e){}
 const p=(location.hash||'#home').slice(1),u=me();
 drawNav();
 const gated=['dash','tasks','levels','refs','wallet','deposit','withdraw','history','orders','trade','support','profile'];
 if(gated.includes(p)&&!u){return go('login')}
 const need=['tasks','wallet','withdraw'];
 if(u&&u.status!=='active'&&need.includes(p)){$('#app').innerHTML=`<div class="wrap"><div class="card form"><h2>حسابك قيد المراجعة</h2><p>لا يمكن استخدام المهام أو المحفظة قبل موافقة الإدارة.</p></div></div>`;return}
 if(p==='admin'&&!S.admin)return go('admin-login');
 (V[p]||V.home)();window.scrollTo(0,0)
}
const V={
home(){$('#app').innerHTML=`
<div class="hero"><div class="wrap"><div><h1>SATR <span>اقرأ، أنجز، واكسب.</span></h1>
<p>منصة عربية للقراءة اليومية: أنجز مهام قراءة قصيرة واكسب مكافآت صغيرة مموّلة من رعاة وإعلانات داخل المحتوى.</p>
<p><button class="btn" onclick="go('register')">إنشاء حساب</button> <button class="btn alt" onclick="go('login')">تسجيل الدخول</button></p></div>
<div class="read" aria-hidden="true"><div class="ln">كل يوم نص جديد، خمسة أسطر فقط،</div><div class="ln">تقرؤه بهدوء ثم تضغط إتمام.</div><div class="ln hot">مكافأتك تُضاف إلى محفظتك فوراً،</div><div class="ln">ويمكنك سحبها أسبوعياً عبر شام كاش.</div><div class="ln">بلا وعود أرباح مضمونة.</div></div></div></div>
<section><div class="wrap"><h2>مستويات العضوية</h2><div class="grid">${planCards(false)}</div></div></section>
<section><div class="wrap"><h2>كيف تعمل المنصة</h2><div class="grid">
<div class="card"><b>سجّل حسابك</b><p class="muted">أدخل رقم هاتفك وكلمة مرور، وتنتظر موافقة الإدارة.</p></div>
<div class="card"><b>اقرأ وأنجز</b><p class="muted">أكمل مهامك اليومية حسب مستواك، مرة واحدة لكل مهمة.</p></div>
<div class="card"><b>اسحب أسبوعياً</b><p class="muted">اطلب السحب إلى شام كاش، وتراجعه الإدارة وتسجّل الدفع.</p></div></div></div></section>
<section><div class="wrap"><h2>الأسئلة الشائعة</h2>
${faqHTML()}
<details><summary>كيف أتواصل مع الدعم؟</summary><p><a href="${tgl()}" target="_blank" rel="noopener">راسلنا على تلغرام</a></p></details></div></section>`},
register(){$('#app').innerHTML=`<div class="wrap"><form class="card form" onsubmit="return reg(event)"><h2>إنشاء حساب</h2>
<label>اسمك</label><input id="nm" required maxlength="40" placeholder="الاسم الذي سيظهر لدى الإدارة"><label>رقم الهاتف</label><input id="ph" inputmode="numeric" required pattern="09[0-9]{8}" placeholder="09xxxxxxxx">
<label>كلمة المرور</label><input id="pw" type="password" minlength="8" required>
<label>تأكيد كلمة المرور</label><input id="pw2" type="password" required>
<label>كود الدعوة (اختياري)</label><input id="rc" placeholder="SATR10001">
<p><button class="btn" style="width:100%">إنشاء حساب</button></p></form></div>`},
login(){$('#app').innerHTML=`<div class="wrap"><form class="card form" onsubmit="return login(event)"><h2>تسجيل الدخول</h2>
<label>رقم الهاتف</label><input id="ph" required><label>كلمة المرور</label><input id="pw" type="password" required>
<p><button class="btn" style="width:100%">دخول</button></p><p class="muted">نسيت كلمة المرور؟ تُرسل الإدارة رابط استعادة بعد التحقق من هويتك عبر تلغرام.</p></form></div>`},
'admin-login'(){$('#app').innerHTML=`<div class="wrap"><form class="card form" onsubmit="return adminLogin(event)"><h2>دخول الإدارة</h2><label>كلمة مرور الإدارة</label><input id="ap" type="password" required><p><button class="btn">دخول</button></p></form></div>`},
dash(){const u=me(),p=plan(u);const earned=S.log.filter(l=>l.u===u.id&&l.k==='مهمة').reduce((a,b)=>a+b.a,0);
$('#app').innerHTML=`<div class="wrap"><section><h2>أهلاً ${esc(u.name)}</h2>${S.ann.slice(-3).reverse().map(a=>`<div class="note">📢 ${esc(a.text)} <small class="muted">${a.d}</small></div>`).join('')}
<div class="grid">${[['رقم الحساب',u.id],['الهاتف',u.phone],['المستوى',p.name],['الحالة',u.status==='active'?'<span class="tag t-ok">نشط</span>':'<span class="tag t-w">معلّق</span>'],['الرصيد الإجمالي',fmt(u.bal+u.hold)],['المتاح',fmt(u.bal)],['المحجوز',fmt(u.hold)],['أرباح المهام',fmt(earned)],['مهام مكتملة',u.done.length],['الأصدقاء المدعوون',u.inv.length],['أيام القراءة المتتالية 🔥',u.streak||0]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="stat">${b}</div></div>`).join('')}</div></section></div>`},
tasks(){const u=me(),p=plan(u),d=today();
 const list=TASKS.filter(t=>t.lv<=u.plan).slice(0,p.tasks);
 $('#app').innerHTML=`<div class="wrap"><section><h2>المهام اليومية</h2><p class="muted">مهامك اليوم: ${p.tasks}. المكافأة ${fmt(p.reward)} لكل مهمة. 🔥 أيام متتالية: ${u.streak||0}</p>
 ${list.map(t=>{const dn=u.done.includes(t.id+d);return `<div class="card" style="margin-bottom:12px"><div class="task"><div><b>${esc(t.t)}</b>${t.body.map(l=>`<p>${esc(l)}</p>`).join('')}${t.q&&!dn?`<p><b>${esc(t.q.q)}</b></p><select id="qa_${t.id}"><option value="-1">اختر الإجابة</option>${t.q.o.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`:''}</div>
 <div><div class="tag t-w">${fmt(p.reward)}</div><p><button class="btn ${dn?'':'ok'}" ${dn?'disabled':''} onclick="doTask(${t.id})">${dn?'تمت اليوم':'إتمام المهمة'}</button></p></div></div></div>`}).join('')}</section></div>`},
levels(){$('#app').innerHTML=`<div class="wrap"><section><h2>مستويات العضوية</h2><div class="note">المكافآت اليومية أدناه هي القيمة الفعلية لكل مهمة، وليست أرباحاً مضمونة. وتعتمد على تمويل الرعاة.</div><div class="grid">${planCards(true)}</div></section></div>`},
refs(){const u=me(),link=location.href.split('#')[0]+'?ref='+u.code,act=u.inv.filter(i=>i.ok).length;
$('#app').innerHTML=`<div class="wrap"><section><h2>دعوة الأصدقاء</h2><div class="card"><div class="muted">كود الدعوة</div><div class="stat">${u.code}</div>
<label>غيّر الكود كما تريد (حروف إنجليزية وأرقام)</label><div style="display:flex;gap:8px;margin-bottom:12px"><input id="nc" value="${u.code}" dir="ltr" maxlength="20"><button class="btn sm" onclick="setCode()">حفظ</button></div>
<p dir="ltr" class="muted" style="text-align:right">${link}</p><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${u.code}');toast('تم نسخ الكود')">نسخ الكود</button>
<button class="btn alt" onclick="navigator.share?navigator.share({url:'${link}'}):toast('انسخ الرابط يدوياً')">مشاركة الرابط</button></div>
<div class="grid" style="margin-top:16px"><div class="card"><div class="muted">المدعوون</div><div class="stat">${u.inv.length}</div></div><div class="card"><div class="muted">المفعّلون</div><div class="stat">${act}</div></div><div class="card"><div class="muted">المكافآت</div><div class="stat">${fmt(u.inv.filter(i=>i.ok).length*plan(u).inv)}</div></div></div>
<p class="muted">المكافأة رمزية، تُضاف مرة واحدة لكل حساب بعد تفعيل الإدارة، ولا ترتبط بدفع المدعو. الدعوة الذاتية مرفوضة.</p></section></div>`},

async function pull(){if(!ONLINE||BUSY||PEND)return;BUSY=true;
 try{const d=await jb('GET'),before=snap();
  if(d&&Array.isArray(d.users)){S.users=d.users;S.wd=d.wd||[];S.log=d.log||[];S.msgs=d.msgs||[];S.faq=d.faq||S.faq;S.ann=d.ann||[];S.alog=d.alog||[];Object.assign(S.settings,d.settings||{});S.seq=d.seq||S.seq;if(Array.isArray(d.tasks)){TASKS.length=0;TASKS.push(...d.tasks)}}
  if(snap()!==before){LAST=snap();refreshView()}}catch(e){}
 BUSY=false}
function refreshView(){drawNav();const a=document.activeElement;
 if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#app')&&(a.value||a.tagName==='SELECT'))return;
 if([...document.querySelectorAll('#mx,[id^=r_]')].some(i=>i.value))return;
 const y=scrollY;render();scrollTo(0,y)}
const LIVE=['orders','support','admin','deposit','dash','wallet','history'];
setInterval(()=>{if(!document.hidden&&LIVE.includes((location.hash||'#home').slice(1)))pull()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
addEventListener('focus',pull);
boot();
</script>
